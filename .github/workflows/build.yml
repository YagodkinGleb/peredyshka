name: Сборка установщика

# Запускается кнопкой на сайте GitHub, а также автоматически при создании тега v*
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # На windows-latest уже стоят MSVC Build Tools, ставить их не нужно
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости
        run: npm ci

      - name: Тесты логики
        run: npm test

      - name: Браузер для проверки интерфейса
        run: npx playwright install chromium

      - name: Проверка размеров, автопереходов и настроек
        run: npm run test:ui

      - name: Сборка
        run: npm run build -- --ci -- --locked

      - name: Выложить установщик
        uses: actions/upload-artifact@v4
        with:
          name: Peredyshka-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Если сборку запустил тег вида v1.0.0 — публикуем релиз с прямой ссылкой
      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Установщик для Windows 10 и 11.

            Скачай файл `.exe` ниже и запусти. Ничего дополнительно
            устанавливать не нужно.
